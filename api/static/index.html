<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project X — Contract Watchlist</title>
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --line: #e2e0da;
    --line-strong: #cbc8c0;
    --ink: #1c1b19;
    --ink-2: #57544e;
    --ink-3: #8b877f;
    --accent: #1f4e79;
    --accent-soft: #e8eff6;
    --up: #9c3024;
    --flat: #5f7a52;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 20px 28px 0;
  }
  .title-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--ink-3); font-size: 13px; }

  .stats { display: flex; gap: 34px; flex-wrap: wrap; margin: 18px 0 0; padding-bottom: 18px; }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
  .stat .value { font-size: 23px; font-weight: 600; margin-top: 3px; letter-spacing: -0.02em; }
  .stat .note { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
  .stat.highlight .value { color: var(--accent); }

  .bar { height: 5px; background: var(--line); border-radius: 3px; margin-top: 7px; width: 150px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }

  main { display: grid; grid-template-columns: minmax(0,1fr) 370px; gap: 0; align-items: start; }
  @media (max-width: 1080px) { main { grid-template-columns: 1fr; } }

  .panel-left { padding: 20px 28px 60px; min-width: 0; }
  .panel-right {
    border-left: 1px solid var(--line);
    background: var(--surface);
    padding: 20px 22px 60px;
    min-height: calc(100vh - 160px);
  }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  input, select {
    font: inherit; padding: 7px 10px; border: 1px solid var(--line-strong);
    border-radius: 6px; background: var(--surface); color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  input[type=search] { min-width: 230px; }

  table { width: 100%; border-collapse: collapse; background: var(--surface);
          border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--ink-3); font-weight: 600; padding: 9px 12px;
    border-bottom: 1px solid var(--line); background: #fbfaf8; white-space: nowrap;
  }
  td { padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #fbfaf8; }
  tbody tr.selected { background: var(--accent-soft); }
  td.num { text-align: right; }
  .rank { color: var(--ink-3); font-size: 13px; }
  .key { font-size: 12px; color: var(--ink-2); max-width: 260px; overflow: hidden;
         text-overflow: ellipsis; white-space: nowrap; }

  .tag { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 4px;
         background: #f0eee9; color: var(--ink-2); white-space: nowrap; }
  .grew { color: var(--up); font-weight: 600; }
  .nogrew { color: var(--ink-3); }

  .pager { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-size: 13px; color: var(--ink-2); }
  button {
    font: inherit; padding: 6px 12px; border: 1px solid var(--line-strong);
    background: var(--surface); border-radius: 6px; cursor: pointer; color: var(--ink);
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }

  .detail h2 { font-size: 15px; margin: 0 0 3px; font-weight: 600; }
  .detail .key-full { font-size: 11px; color: var(--ink-3); word-break: break-all; margin-bottom: 16px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0;
        border-bottom: 1px solid var(--line); font-size: 13px; }
  .kv dt { color: var(--ink-2); }
  .kv dd { margin: 0; text-align: right; font-weight: 500; }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
                   color: var(--ink-3); margin: 22px 0 8px; }
  .callout { background: var(--accent-soft); border-radius: 7px; padding: 12px 14px; font-size: 13px;
             color: #163a59; line-height: 1.5; }
  .empty { color: var(--ink-3); font-size: 14px; padding: 40px 0; text-align: center; }
  a { color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>Contract watchlist</h1>
    <span class="sub">Department of Veterans Affairs &middot; contracts awarded FY2018 &middot; ranked by predicted unplanned cost growth</span>
  </div>
  <div class="stats" id="stats"><span class="sub">Loading…</span></div>
</header>

<main>
  <section class="panel-left">
    <div class="controls">
      <input type="search" id="search" placeholder="Search contract key…">
      <select id="competed"><option value="">All competition types</option></select>
      <select id="minAward">
        <option value="0">Any award size</option>
        <option value="100000">$100k and above</option>
        <option value="1000000">$1M and above</option>
        <option value="10000000">$10M and above</option>
      </select>
    </div>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Contract</th>
          <th class="num">Awarded</th>
          <th class="num">Predicted growth</th>
          <th>Competition</th>
          <th class="num">What happened</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <div class="pager">
      <button id="prev">Previous</button>
      <button id="next">Next</button>
      <span id="pageinfo"></span>
    </div>
  </section>

  <aside class="panel-right" id="detail">
    <div class="empty">Select a contract to see why it is ranked here.</div>
  </aside>
</main>

<script>
const money = n => {
  if (n === null || n === undefined) return "—";
  const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(2) + "B";
  if (a >= 1e6) return (n/1e6).toFixed(2) + "M";
  if (a >= 1e3) return (n/1e3).toFixed(0) + "k";
  return n.toFixed(0);
};
const dollars = n => (n < 0 ? "-$" : "$") + money(Math.abs(n));

let offset = 0, limit = 50, total = 0, selected = null;

async function loadStats() {
  const s = await (await fetch("/api/summary?top_k=200")).json();
  const pctOfCeiling = s.ceiling ? (s.watchlist_captured / s.ceiling * 100) : 0;
  const lift = s.watchlist_captured - s.baseline_captured;
  const liftPct = s.baseline_captured ? (lift / s.baseline_captured * 100) : 0;

  document.getElementById("stats").innerHTML = `
    <div class="stat highlight">
      <div class="label">Captured by top 200</div>
      <div class="value mono">${dollars(s.watchlist_captured)}</div>
      <div class="note">${s.watchlist_grew} of 200 grew</div>
      <div class="bar"><i style="width:${Math.min(100,pctOfCeiling).toFixed(0)}%"></i></div>
    </div>
    <div class="stat">
      <div class="label">Baseline, biggest first</div>
      <div class="value mono">${dollars(s.baseline_captured)}</div>
      <div class="note">${liftPct >= 0 ? "+" : ""}${liftPct.toFixed(0)}% improvement</div>
    </div>
    <div class="stat">
      <div class="label">Best possible</div>
      <div class="value mono">${dollars(s.ceiling)}</div>
      <div class="note">${pctOfCeiling.toFixed(0)}% reached</div>
    </div>
    <div class="stat">
      <div class="label">Contracts screened</div>
      <div class="value mono">${s.test_contracts.toLocaleString()}</div>
      <div class="note">${dollars(s.test_total_growth)} total growth</div>
    </div>`;
}

async function loadFilters() {
  const f = await (await fetch("/api/filters")).json();
  const sel = document.getElementById("competed");
  f.extent_competed.forEach(v => {
    const o = document.createElement("option");
    o.value = v; o.textContent = v.length > 34 ? v.slice(0,32) + "…" : v;
    sel.appendChild(o);
  });
}

async function loadRows() {
  const q = new URLSearchParams({
    limit, offset,
    min_award: document.getElementById("minAward").value,
  });
  const c = document.getElementById("competed").value;
  const s = document.getElementById("search").value.trim();
  if (c) q.set("competed", c);
  if (s) q.set("search", s);

  const data = await (await fetch("/api/watchlist?" + q)).json();
  total = data.total;

  document.getElementById("tbody").innerHTML = data.rows.map(r => `
    <tr data-key="${r.contract_award_unique_key}" class="${selected===r.contract_award_unique_key?'selected':''}">
      <td class="rank mono">${r.rank}</td>
      <td class="key">${r.contract_award_unique_key}</td>
      <td class="num mono">${dollars(r.original_award)}</td>
      <td class="num mono">${dollars(r.predicted_dollars)}</td>
      <td><span class="tag">${(r.extent_competed||"—").slice(0,26)}</span></td>
      <td class="num mono ${r.target_grew ? 'grew' : 'nogrew'}">
        ${r.target_grew ? dollars(r.target_dollars) : "no growth"}
      </td>
    </tr>`).join("") || `<tr><td colspan="6" class="empty">Nothing matches those filters.</td></tr>`;

  document.querySelectorAll("#tbody tr[data-key]").forEach(tr =>
    tr.addEventListener("click", () => showDetail(tr.dataset.key)));

  document.getElementById("pageinfo").textContent =
    total ? `${offset+1}–${Math.min(offset+limit,total)} of ${total}` : "";
  document.getElementById("prev").disabled = offset === 0;
  document.getElementById("next").disabled = offset + limit >= total;
}

async function showDetail(key) {
  selected = key;
  document.querySelectorAll("#tbody tr").forEach(tr =>
    tr.classList.toggle("selected", tr.dataset.key === key));

  const d = await (await fetch("/api/contract/" + encodeURIComponent(key))).json();
  const c = d.contract;
  const ind = d.similar_by_industry, dur = d.similar_by_duration;

  const outcome = c.target_grew
    ? `This contract did grow, by ${dollars(c.target_dollars)} in its first 12 months.`
    : `This contract did not grow in its first 12 months.`;

  document.getElementById("detail").innerHTML = `
    <div class="detail">
      <h2>Rank ${c.rank}</h2>
      <div class="key-full mono">${c.contract_award_unique_key}</div>

      <div class="callout">${outcome}</div>

      <div class="section-label">At award</div>
      <dl style="margin:0">
        <div class="kv"><dt>Award date</dt><dd class="mono">${c.award_date ?? "—"}</dd></div>
        <div class="kv"><dt>Awarded amount</dt><dd class="mono">${dollars(c.original_award)}</dd></div>
        <div class="kv"><dt>Planned duration</dt><dd class="mono">${c.planned_duration_days ?? "—"} days</dd></div>
        <div class="kv"><dt>Competition</dt><dd>${c.extent_competed ?? "—"}</dd></div>
        <div class="kv"><dt>Pricing</dt><dd>${c.contract_pricing_type ?? "—"}</dd></div>
        <div class="kv"><dt>Industry code</dt><dd class="mono">${c.naics_code ?? "—"}</dd></div>
        <div class="kv"><dt>Service code</dt><dd class="mono">${c.product_service_code ?? "—"}</dd></div>
        <div class="kv"><dt>Under an umbrella</dt><dd>${c.under_umbrella ? "Yes" : "No"}</dd></div>
      </dl>

      <div class="section-label">Prediction</div>
      <dl style="margin:0">
        <div class="kv"><dt>Predicted growth</dt><dd class="mono">${dollars(c.predicted_dollars)}</dd></div>
        <div class="kv"><dt>Estimated chance of growth</dt><dd class="mono">${(c.predicted_chance*100).toFixed(1)}%</dd></div>
      </dl>

      <div class="section-label">How similar contracts behaved</div>
      <dl style="margin:0">
        <div class="kv">
          <dt>Same industry and competition type</dt>
          <dd class="mono">${ind.contracts ? `${ind.pct_grew}% of ${ind.contracts}` : "too few"}</dd>
        </div>
        <div class="kv">
          <dt>Similar duration (±90 days)</dt>
          <dd class="mono">${dur.contracts ? `${dur.pct_grew}% of ${dur.contracts.toLocaleString()}` : "too few"}</dd>
        </div>
      </dl>
      <p class="sub" style="font-size:12px;margin-top:10px">
        Comparison figures come from the training year only, so they reflect what was
        knowable before this contract was awarded.
      </p>
    </div>`;
}

document.getElementById("prev").onclick = () => { offset = Math.max(0, offset - limit); loadRows(); };
document.getElementById("next").onclick = () => { offset += limit; loadRows(); };
["search","competed","minAward"].forEach(id =>
  document.getElementById(id).addEventListener("input", () => { offset = 0; loadRows(); }));

loadStats(); loadFilters(); loadRows();
</script>
</body>
</html>
